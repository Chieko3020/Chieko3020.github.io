      mutex: true
      listFolded: false
      # lrcType: Meting 自动设置歌词
  meting:
    # https://github.com/metowolf/MetingJS
    # if you want to use meting, please enable aplayer first
    enable: true
    # meting_api: https://api.qijieya.cn/meting/?server=netease&type=playlist&id=14424322349 # custom api
    meting_api: https://music.chieko3020.xyz/?type=radio&id=1228381556 # djratio
