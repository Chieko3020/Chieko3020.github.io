  content: 
    author: true
    link: true
    title: true
    date: true
    updated: true
    license: true
    license_type: by-nc-sa # https://creativecommons.org/licenses

# Back To Top
top:
  enable: true
  position: right # left or right
  icon:
    url: "../images/Website_Config/loading/loading.webp" # this path is relative to the css/style.css, so it needs to go up one level to reach the images folder
